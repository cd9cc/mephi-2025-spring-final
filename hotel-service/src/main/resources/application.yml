server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotel-service;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  mvc:
    format:
      date: iso
  data:
    web:
      pageable:
        max-page-size: 100

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  public-paths:
    - /actuator/health
    - /actuator/health/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

demo-data:
  enabled: ${DEMO_DATA:true}

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{bookingId:-}] "

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

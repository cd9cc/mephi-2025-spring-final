server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotel-service-internal
              uri: no://op
              predicates:
                - Path=/api/rooms/*/confirm-availability,/api/rooms/*/release
              filters:
                - SetStatus=404
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read_only

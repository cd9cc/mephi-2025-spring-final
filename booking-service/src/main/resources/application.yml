server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:booking-service;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  data:
    web:
      pageable:
        max-page-size: 100

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: 1h
  public-paths:
    - /api/bookings/user/register
    - /api/bookings/user/auth
    - /actuator/health
    - /actuator/health/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

demo-data:
  enabled: ${DEMO_DATA:true}

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{bookingId:-}] "

hotel-client:
  base-url: http://hotel-service
  connect-timeout: 1s
  read-timeout: 2s

booking:
  auto-select-max-rooms: 3
  pending-timeout: 5m
  pending-recovery-interval: 1m

resilience4j:
  retry:
    instances:
      hotel:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - ru.mephi.hotelbooking.booking.client.HotelUnavailableException
  circuitbreaker:
    instances:
      hotel:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - ru.mephi.hotelbooking.booking.client.HotelUnavailableException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

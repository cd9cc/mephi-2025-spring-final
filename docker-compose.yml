x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-service-env: &service-env
  EUREKA_URL: http://eureka-server:8761/eureka
  JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-0123456789abcdef}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT-ecs}

services:
  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]

  hotel-service:
    build:
      context: .
      args:
        MODULE: hotel-service
    environment:
      <<: *service-env
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]

  booking-service:
    build:
      context: .
      args:
        MODULE: booking-service
    environment:
      <<: *service-env
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      <<: *service-env
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
